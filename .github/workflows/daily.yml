# クラウド移行用ワークフロー雛形（v1 では未使用。クラウド化フェーズで有効化）。
# 必要な GitHub Secrets:
#   ANTHROPIC_API_KEY, MINIMAX_API_KEY, YOUTUBE_CLIENT_SECRET (json), YOUTUBE_TOKEN (json)
# VOICEVOX はジョブ実行時のみ service container で起動（常時稼働不要・2話者内蔵）。
name: doci-daily

on:
  schedule:
    - cron: "0 0 * * *" # UTC 00:00 = JST 09:00
  workflow_dispatch: {}

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps
        run: pip install -e .
      - name: Wait for VOICEVOX
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:50021/version && break || sleep 2
          done
      - name: Restore YouTube secrets
        run: |
          printf '%s' "$YOUTUBE_CLIENT_SECRET" > client_secret.json
          printf '%s' "$YOUTUBE_TOKEN" > youtube_token.json
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      - name: Run daily
        env:
          TEXT_BACKEND: anthropic
          TEXT_MODEL: claude-opus-4-8
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_MEDIA_BASE_URL: https://api.minimax.io/v1
          VOICEVOX_URL: http://localhost:50021
          VOICEVOX_URL_FALLBACK: http://localhost:50021
          VOICE_CHINESE_AI: "3"
          VOICE_AMERICAN_AI: "14"
          YOUTUBE_PRIVACY: unlisted
        run: python -m doci.run_daily
