[project]
name = "doci"
version = "0.1.0"
description = "ラジオ番組から YouTube ショート動画を日次自動生成・投稿するワークフロー"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.2",
    "youtube-transcript-api>=1.2",
]

[project.optional-dependencies]
# TEXT_BACKEND=anthropic（クラウド経路）を使う場合のみ
anthropic = ["anthropic>=0.40"]

[project.scripts]
doci = "doci.run_daily:main"
doci-admin = "doci.admin.server:main"

[tool.setuptools]
packages = ["doci", "doci.admin"]

[tool.setuptools.package-data]
"doci.admin" = ["static/*"]
