voices = "voices.json"

[channel]
id = "ideology"
name = "doci（ソ連/アメリカ）"
rotation = ["capitalism", "communism"]

[corners.communism]
label = "共産主義ネタ"
persona = "prompts/persona_chinese.md"
corner = "prompts/corner_communism.md"
voice = "chinese_ai"

[corners.capitalism]
label = "資本主義ネタ"
persona = "prompts/persona_american.md"
corner = "prompts/corner_capitalism.md"
voice = "american_ai"

[style]
# テーマ: 墨地+ゴールド+明朝のアーカイブ/印刷物調(思想史コンテンツに合わせた既定デザイン)。
# テーマ一覧とスタイル対応方針はREADME「チャンネル別デザインテーマ」参照。
theme = "classic"

[style.bgm]
dir = "bgm"

[publish]
platforms = ["youtube"]

[publish.youtube]
privacy = "public"
client_secret = "secrets/ideology/client_secret.json"
token = "secrets/ideology/youtube_token.json"

[pipeline]
narration_opening_guard = true
narration_pattern_check = true
# corner_communism/corner_capitalismの「ショート動画用」という一般的な文言が
# YouTube運用系チャンネル向けの厳格な出典検証(#81)に誤って引っかかるため明示的に無効化
research_requires_youtube_case_studies = false
youtube_auto_playlist = true
youtube_auto_engagement_comment = true
# narration末尾の一文をLLMを介さずそのまま投稿する。動画本編の締めを本編の
# 言葉のまま届けるのが狙いで、疑問形かどうかは問わない。LLM新規生成の
# 問いかけはこの狙いと相反するためdebateへはフォールバックせず、末尾の一文を
# 使えない回はコメント投稿自体をスキップする(issue #98)。
youtube_engagement_comment_mode = "closing_sentence"
