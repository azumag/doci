voices = "voices.json"

[channel]
id = "youtube-growth"
name = "YouTube攻略Ch"
rotation = ["shorts", "video", "analytics"]

[corners.shorts]
label = "ショート攻略"
persona = "prompts/persona_growth_advisor.md"
corner = "prompts/corner_shorts.md"
voice = "growth_advisor"

[corners.video]
label = "通常動画攻略"
persona = "prompts/persona_growth_advisor.md"
corner = "prompts/corner_video.md"
voice = "growth_advisor"

[corners.analytics]
label = "分析・改善"
persona = "prompts/persona_growth_advisor.md"
corner = "prompts/corner_analytics.md"
voice = "growth_advisor"

[style.subtitle]
fill = "#ffffff"
stroke = "#07111f"
box_color = "#10243f"
box_alpha = 0.52
position_ratio = 0.66

[style.thumbnail]
font_family = "'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif"
title_color = "#ffffff"

[style.chart]
palette = ["#ff3b30", "#2563eb", "#f59e0b", "#22c55e", "#e2e8f0"]

[style.video]
pad_color = "0x07111f"
filter = "eq=saturation=1.05:contrast=1.03"

[style.bgm]
dir = "bgm"
volume = 0.18
rotation = "fixed"

[publish]
platforms = ["youtube"]

[publish.youtube]
privacy = "unlisted"
client_secret = "secrets/youtube-growth/client_secret.json"
token = "secrets/youtube-growth/youtube_token.json"

[pipeline]
research = true
factcheck = true
plan = true
performance_feedback = true
title_pattern_check = true
narration_opening_guard = true
narration_pattern_check = true
ambiguous_date_title_check = true
max_uploads_per_day = 1
performance_eval_window_hours = 72
performance_gated_publish = true
feedback_repository = "azumag/doci"
youtube_auto_playlist = true
youtube_auto_engagement_comment = true
