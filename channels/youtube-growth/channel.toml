voices = "voices.json"

[channel]
id = "youtube-growth"
name = "YouTube攻略Ch"
rotation = ["shorts", "video", "analytics"]

[corners.shorts]
label = "ショート攻略"
persona = "prompts/persona_growth_advisor.md"
corner = "prompts/corner_shorts.md"
voice = "growth_advisor"

[corners.video]
label = "通常動画攻略"
persona = "prompts/persona_growth_advisor.md"
corner = "prompts/corner_video.md"
voice = "growth_advisor"

[corners.analytics]
label = "分析・改善"
persona = "prompts/persona_growth_advisor.md"
corner = "prompts/corner_analytics.md"
voice = "growth_advisor"

[style]
# テーマ: フラット・ダッシュボード調(ネイビー+赤青アクセント+極太ゴシック)。
# テーマ一覧とスタイル対応方針はREADME「チャンネル別デザインテーマ」参照。
theme = "tech"

[style.subtitle]
fill = "#ffffff"
stroke = "#07111f"
box_color = "#10243f"
box_alpha = 0.52
position_ratio = 0.66

[style.video]
pad_color = "0x07111f"
filter = "eq=saturation=1.05:contrast=1.03"

[style.bgm]
dir = "bgm"
volume = 0.18
rotation = "fixed"

[publish]
platforms = ["youtube"]

[publish.youtube]
privacy = "unlisted"
client_secret = "secrets/youtube-growth/client_secret.json"
token = "secrets/youtube-growth/youtube_token.json"
analytics_token = "secrets/youtube-growth/youtube_analytics_token.json"

[pipeline]
research = true
factcheck = true
plan = true
performance_feedback = true
title_pattern_check = true
narration_opening_guard = true
narration_pattern_check = true
ambiguous_date_title_check = true
max_uploads_per_day = 1
feedback_repository = "azumag/doci"
youtube_auto_playlist = true
youtube_auto_engagement_comment = true
# 全動画がunlisted（限定公開）で不特定多数の議論が発生しないため、討論誘発型
# ではなく実用的な行動喚起コメントにする。viewer_actionが空ならnarration末尾の
# 宣言的な締め（output_rules_addendum.md）を代わりに使う(issue #98)。
youtube_engagement_comment_mode = "call_to_action"
# 動画が紹介するYouTube運用施策(viewer_action)を検知し、適用要否の判断は人間に
# 委ねるためGitHub issueとして通知する。適用の自動化は行わない(issue #90)。
tactic_issues = true
